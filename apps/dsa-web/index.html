<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/equitylens.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b4e" />
    <meta name="description" content="EquityLens financial research workspace for SEC-sourced company fundamentals and original filing evidence." />
    <script>
      (() => {
        const storageKey = 'theme';
        const root = document.documentElement;
        const storedTheme = localStorage.getItem(storageKey);
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'light';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <title>EquityLens · Financial Research</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
